[workspace]
members = [".", "crates/core", "crates/render", "src-tauri"]
resolver = "2"

[package]
name = "diffplayerqc"
version = "1.3.0"
edition = "2021"
description = "Frame-accurate differential video QC player"
authors = ["DiffPlayerQC"]
license = "MIT"

[lib]
name = "diffplayerqc"
path = "src/lib.rs"

[[bin]]
name = "diffplayerqc"
path = "src/main.rs"
required-features = ["egui-app"]

# egui-app: binario v1 (eframe). Sin este feature, solo librería (decoder, scopes…) para Tauri.
[features]
default = ["egui-app"]
egui-app = [
    "dep:eframe",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:wgpu",
    "dep:dark-light",
    "dep:rfd",
    "dep:image",
    "dep:directories",
    "dep:xcap",
]

[dependencies]
diffplayerqc-core = { path = "crates/core" }
diffplayerqc-render = { path = "crates/render" }
ffmpeg-sys-next = "7.1"
crossbeam-channel = "0.5"
anyhow        = "1"
bytemuck      = { version = "1", features = ["derive"] }
log           = "0.4"
env_logger    = "0.11"
parking_lot   = "0.12"
chrono = "0.4.44"
rodio = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe        = { version = "0.27", features = ["wgpu", "persistence"], optional = true }
egui          = { version = "0.27", optional = true }
egui-wgpu     = { version = "0.27", optional = true }
wgpu          = { version = "0.19", features = ["wgsl"], optional = true }
dark-light    = { version = "1", optional = true }
rfd           = { version = "0.14", optional = true }
image = { version = "0.25.9", optional = true }
directories = { version = "6.0.0", optional = true }
xcap = { version = "0.8.3", optional = true }

# Por defecto: velocidad para uso interactivo QC. Ver docs/BUILD_PROFILES.md.
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

# Binario más pequeño para distribución (más lento en CPU).
[profile.release-small]
inherits      = "release"
opt-level     = "s"

[profile.dev]
opt-level     = 1

# Desactivar las aserciones de debug estrictas en icrate y objc2 para evitar
# el crasheo en macOS 15+ (Sequoia) debido a countByEnumeratingWithState

[profile.dev.package.icrate]
debug-assertions = false

[profile.dev.package.objc2]
debug-assertions = false